spring.application.name=agentmain
server.port=8081
logging.level.root = INFO
logging.level.com.genai.aichatagent=INFO
logging.level.org.springframework.ai=INFO
spring.main.allow-bean-definition-overriding=true
logging.level.ch.qos.logback=WARN
#Anthropic
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
#Huggingface
spring.ai.huggingface.chat.api-key=${HUGGING_FACE_API_KEY}
spring.ai.huggingface.chat.url=https://router.huggingface.co/hf-inference/models/

#Commented below will be enabled for huggingface usage only
# and to create custom endpoints at https://endpoints.huggingface.co/
#spring.ai.anthropic.chat.options.model=Qwen/Qwen2.5-Coder-78-Instruct:nscale
#spring.ai.anthropic.base-url=https://router.huggingface.co

#ollama

spring.ai.ollama.chat.options.model=mistral:7b
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.max-tokens=512
spring.ai.ollama.chat.options.temperature=0.7

